# Hinty Agents desktop app for macOS: an UNSIGNED build check (pull requests that touch the app or the bridge, or by
# hand). It proves the DMG still builds for both processors and that the bundled Node.js is the pinned one; nothing is
# uploaded or published, and an unsigned DMG is never shipped.
#
# The signed and notarized DMGs are not built here: this repository is public and holds no Apple secret (certificate,
# App Store Connect key). They are built from a tag of this repository in a separate private build repository, which
# signs the app and every binary in it with the Developer ID, notarizes and staples the app and the DMG, checks them
# with codesign, stapler and spctl, and tests the installed app end to end. The DMGs are then attached to the release
# here by hand.
name: Desktop app (macOS, unsigned check)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - 'src/**'
      - 'bin/**'
      - 'claude-plugin/**'
      - 'hermes-plugin/**'
      - 'hooks/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop-mac.yml'

permissions:
  contents: read

concurrency:
  group: desktop-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dmg:
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Install the bridge's dependencies (socket.io-client)
        run: npm ci --omit=dev --ignore-scripts

      - name: Install the desktop build tools (Electron, electron-builder)
        working-directory: desktop
        run: npm ci

      - name: Build the DMG (unsigned, not notarized)
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          node scripts/stage.mjs --platform darwin --arch ${{ matrix.arch }}
          npx --no-install electron-builder --mac dmg --${{ matrix.arch }} --publish never -c.mac.notarize=false
          ls -l dist/*.dmg

      - name: Check the processor and the bundled Node.js
        working-directory: desktop
        run: |
          app=$(ls -d dist/mac*/"Hinty Agents.app" | head -n 1)
          want=$([ "${{ matrix.arch }}" = x64 ] && echo x86_64 || echo arm64)
          node_bin="$app/Contents/Resources/node/bin/node"
          [ "$(lipo -archs "$app/Contents/MacOS/Hinty Agents")" = "$want" ]
          [ "$(lipo -archs "$node_bin")" = "$want" ]
          pinned=$(node -p "require('./build/node/RUNTIME.json').node")
          if [ "${{ matrix.arch }}" = arm64 ]; then
            [ "$("$node_bin" --version)" = "v$pinned" ]
            echo "bundled Node.js v$pinned runs"
          fi
